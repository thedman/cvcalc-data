name: CIA rate discovery

on:
  schedule:
    - cron: "0 */6 22-31 * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cia-rate-production
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reviewed-source dependencies
        id: dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Discover, validate, publish and verify sequential monthly rates
        if: always() && steps.dependencies.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_reviewed_rates.py
      - name: Report setup exception
        if: failure() && steps.dependencies.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import sys
          from datetime import date
          sys.path.insert(0, 'scripts')
          from check_new_month import expected_latest
          from fetch_convyta_rates import next_month
          from publish_reviewed_rates import exception, summary
          import json
          month = next_month(json.load(open('cia_rates.json'))[-1]['monthKey'])
          summary(f'HUMAN ACTION REQUIRED: setup failure; expected month {month}')
          exception(month, 'workflow setup', 'Checkout, Python setup or dependency installation failed; inspect workflow logs.')
          PY
