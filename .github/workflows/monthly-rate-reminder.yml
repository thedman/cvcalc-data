name: Auto-update CIA rates

# Runs on the 1st of every month once the prior month's Bank of Canada bond
# yield data is complete.  Derives i1/i2 from BoC government bond averages
# using the empirically calibrated spread vs FTSE Canada corporate indices:
#   i1 = round(boc_5_10yr + 0.60%, nearest 0.1%)
#   i2 = round(boc_10yr_plus + 1.61%, nearest 0.1%)
# Calibrated against all 2025 months + Jan/Feb 2026 — error ≤ 0.1% per rate.

on:
  schedule:
    - cron: "0 14 1 * *"   # 1st of every month at 14:00 UTC (10am ET)
  workflow_dispatch:        # manual trigger for testing / backfill

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Calculate and append new CIA rate
        id: update
        run: |
          python3 - <<'EOF'
          import json, urllib.request, datetime, sys, os

          # ── Target month: previous calendar month ──────────────────────────
          today = datetime.date.today()
          first = today.replace(day=1)
          prev  = first - datetime.timedelta(days=1)
          month_key = prev.strftime("%Y-%m")
          start = prev.strftime("%Y-%m-01")
          end   = prev.strftime("%Y-%m-%d")   # last day of prev month

          print(f"Computing CIA rates for {month_key}")

          # ── Check if already present ────────────────────────────────────────
          with open("cia_rates.json") as f:
              rates = json.load(f)
          if any(r["monthKey"] == month_key for r in rates):
              print(f"  {month_key} already in file — nothing to do")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("added=false\n")
              sys.exit(0)

          # ── Fetch Bank of Canada Valet API ───────────────────────────────────
          url = (
              "https://www.bankofcanada.ca/valet/observations/group/"
              f"bond_yields_marketable/json?start_date={start}&end_date={end}"
          )
          with urllib.request.urlopen(url, timeout=15) as resp:
              data = json.loads(resp.read())

          observations = data.get("observations", [])
          if not observations:
              print("  ERROR: no BoC observations returned")
              sys.exit(1)

          # Monthly average for 5–10 yr and 10+ yr series
          s510 = [float(o["CDN.AVG.5YTO10Y.AVG"]["v"])
                  for o in observations if o.get("CDN.AVG.5YTO10Y.AVG", {}).get("v")]
          s10p = [float(o["CDN.AVG.OVER.10.AVG"]["v"])
                  for o in observations if o.get("CDN.AVG.OVER.10.AVG", {}).get("v")]

          if not s510 or not s10p:
              print("  ERROR: expected series missing from BoC response")
              sys.exit(1)

          avg_510 = sum(s510) / len(s510)
          avg_10p = sum(s10p) / len(s10p)
          print(f"  BoC avg 5-10yr={avg_510:.4f}%  10+yr={avg_10p:.4f}%")

          # ── Apply calibrated spreads ─────────────────────────────────────────
          # Spread = CIA rate - BoC govt yield (percentage points)
          # i1: +0.60 pp  |  i2: +1.61 pp  (derived Jan–Feb 2026, stable ±0.02)
          SPREAD_I1 = 0.60
          SPREAD_I2 = 1.61

          raw_i1 = avg_510 + SPREAD_I1
          raw_i2 = avg_10p + SPREAD_I2

          # Round to nearest 0.1% then express as decimal (e.g. 3.9% → 0.039)
          i1 = round(round(raw_i1 * 10) / 10 / 100, 3)
          i2 = round(round(raw_i2 * 10) / 10 / 100, 3)
          print(f"  Estimated CIA rates → i1={i1}  i2={i2}")

          # ── Append and write ─────────────────────────────────────────────────
          rates.append({"monthKey": month_key, "i1": i1, "i2": i2})
          rates.sort(key=lambda r: r["monthKey"])
          with open("cia_rates.json", "w") as f:
              json.dump(rates, f, indent=2)
              f.write("\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"added=true\nmonth={month_key}\ni1={i1}\ni2={i2}\n")
          EOF

      - name: Commit and push
        if: steps.update.outputs.added == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cia_rates.json
          git commit -m "CIA rates ${{ steps.update.outputs.month }}: i1=${{ steps.update.outputs.i1 }} i2=${{ steps.update.outputs.i2 }} (derived from BoC bond yields)"
          git push
